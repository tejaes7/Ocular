name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Deploy Cloudflare Worker & D1 Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test -w @ocular/backend

      - name: Apply D1 Migrations and Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: packages/backend
          command: |
            d1 execute ocular --file=./migrations/0001_init.sql --remote
            d1 execute ocular --file=./migrations/0002_recovery.sql --remote
            deploy
